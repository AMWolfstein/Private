[workspace]
members = ["crates/core", "crates/local", "crates/mobile", "crates/bindgen"]
exclude = ["vendor/rustix-1.1.5", "vendor/libusb1-sys-0.7.0"]
resolver = "3"

[patch.crates-io]
# Android < 30 may kill processes that probe statx directly (SIGSYS).
# Keep all direct and transitive users on the same compatibility fix.
rustix = { path = "vendor/rustix-1.1.5" }
libusb1-sys = { path = "vendor/libusb1-sys-0.7.0" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
publish = false

[workspace.dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
spotiflac-local = { path = "crates/local" }
spotiflac-core = { path = "crates/core" }
base64 = "0.23"
sha2 = "0.11"
getrandom = "0.4"
tempfile = "3.27"
zip = { version = "=9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
thiserror = "2.0"
uniffi = { version = "=0.32.2", default-features = false }
url = "2.5"
regex = "=1.13.1"
claxon = "=0.4.3"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
cap-std = "=4.0.3"
rustix = { version = "=1.1.5", features = ["fs"] }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
