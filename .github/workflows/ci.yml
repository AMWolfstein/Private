name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dart: ${{ steps.filter.outputs.dart }}
      android: ${{ steps.filter.outputs.android }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            dart:
              - 'third_party/audio_service/**'
              - 'third_party/audioplayers_android/**'
              - 'third_party/ffmpeg_kit_flutter_new_audio/**'
              - 'lib/**'
              - 'test/**'
              - 'integration_test/**'
              - 'android/app/src/test/resources/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'l10n.yaml'
              - '.fvmrc'
              - 'scripts/prepare_flutter_sdk.dart'
              - 'patches/flutter/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'rust_backend/**'
              - 'test/fixtures/**'
              - 'android/app/src/test/resources/lyrics_usability_cases.tsv'
              - 'scripts/*rust*.sh'
              - 'android/gradlew'
              - 'android/gradle/wrapper/**'
              - '.github/workflows/ci.yml'
            android:
              - 'third_party/audio_service/**'
              - 'third_party/audioplayers_android/**'
              - 'third_party/ffmpeg_kit_flutter_new_audio/**'
              - 'android/**'
              - 'rust_backend/**'
              - 'scripts/build_android.sh'
              - 'scripts/prepare_flutter_sdk.dart'
              - 'patches/flutter/**'
              - 'scripts/build_rust_backend.sh'
              - 'scripts/check_backend_apk.py'
              - 'scripts/test_check_backend_apk.py'
              - 'lib/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'l10n.yaml'
              - '.fvmrc'
              - '.github/workflows/ci.yml'

  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.dart == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test scripts/prepare_flutter_sdk.dart

      - name: Analyze
        run: flutter analyze

      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Run tests
        run: flutter test

  rust:
    name: Rust checks & Android libraries
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Cache Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: cargo-${{ runner.os }}-rust-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-${{ hashFiles('rust_backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-rust-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-

      - name: Install C binding generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      # The Android libraries are built once, by Gradle in the android job.
      - name: Rust formatting, Clippy and unit tests
        run: bash scripts/check_rust_backend.sh

  android:
    name: Android Rust builds & native tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.android == 'true'
    env:

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.2"
          # Cache public dependencies, not transforms of the decrypted SDK.
          gradle-home-cache-includes: |
            caches/modules-2
            notifications

      - name: Install Android SDK & NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;4.1.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Test SDK preparation, release selection and APK audits
        run: |
          python3 -m unittest discover -s scripts -p 'test_build_android.py'
          python3 -m unittest discover -s scripts -p 'test_check_backend_apk.py'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Configure Flutter SDK for Gradle
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Install Rust application build and media test prerequisites
        run: |
          cd rust_backend
          rustup show
          sudo apt-get update
          sudo apt-get install -y libclang-dev ffmpeg
          ffmpeg -version
          echo "MORNYE_TEST_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Cache Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: cargo-${{ runner.os }}-android-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-${{ hashFiles('rust_backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-android-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-

      - name: Package Rust application and run native unit tests
        run: gradle -p android :app:assembleDebug :app:testDebugUnitTest

      - name: Build Rust release application
        run: bash scripts/build_android.sh --target lib/main.dart

      - name: Verify Rust release APK payload
        run: |
          python3 scripts/check_backend_apk.py \
            build/app/outputs/flutter-apk/app-release.apk \
            --backend rust --abis arm64-v8a
          # PR builds use Gradle's test key; production signing stays in Release.
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Record Android symbol provenance
        run: |
          test -s build/symbols/android/app.android-arm64.symbols
          test -s build/app/outputs/mapping/release/mapping.txt
          git rev-parse HEAD > build/symbols/android/commit.txt
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/symbols/android/apk-sha256.txt

      - name: Retain Android debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-symbols-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build/symbols/android/
            build/app/outputs/mapping/release/mapping.txt
