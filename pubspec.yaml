name: mornye
description: Mornye, extension-driven music metadata and downloads for mobile devices
publish_to: "none"
version: 5.3.1+167

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  timezone: ^0.11.2

  # State Management
  flutter_riverpod: ^3.4.2

  # Navigation
  go_router: ^18.1.2

# Storage & Persistence
  shared_preferences: ^2.5.6
  # v11 removes legacy Android readers, breaking users who skip the v10 migration.
  # Keep the compatibility release until old encrypted installs can be migrated.
  flutter_secure_storage: 10.3.4
  path_provider: ^2.1.6
  path: ^1.9.1
  sqflite: ^2.4.5

# HTTP & Network
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  crypto: ^3.0.8

  # Streaming backup archives
  archive: ^4.5.2

  # UI Components
  cached_network_image: ^4.0.6
  flutter_cache_manager: ^3.4.6
  liquid_glass_easy: 5.2.0
  cupertino_icons: ^2.0.0
  material_symbols_icons: ^4.2960.0
  volume_controller: ^3.7.1

  # Material Expressive 3 / Dynamic Color
  dynamic_color: ^2.1.0
  material_ui: ^1.9.0
  material_3_expressive: ^1.2.0
  material_color_utilities: 0.13.0

  # Permissions
  permission_handler: ^13.0.1
  # Microphone PCM stream for song recognition on all five platforms.
  record: ^7.1.2

  # File Picker
  file_picker: ^13.3.0

  # JSON Serialization
  json_annotation: ^4.12.0

  # Utils
  url_launcher: ^6.3.3
  device_info_plus: ^13.3.0
  share_plus: ^13.3.1
  receive_sharing_intent: ^1.9.0
  logger: ^2.7.0

  # FFmpeg for audio conversion
  ffmpeg_kit_flutter_new_audio: 2.5.7
  open_filex: ^5.0.0

  video_player: ^2.14.1

  xml: ^7.1.0
  html: ^0.15.7
  dart_smb2: 0.2.3
  synchronized: ^3.5.0

  # Notifications
  flutter_local_notifications: ^22.3.3
  audioplayers: ^6.8.1
  audio_service:
    path: third_party/audio_service
  audio_session: ^0.2.4
  app_links: ^7.2.2

  audio_service_platform_interface: ^0.1.3
dependency_overrides:
  # Preserve Android proxy descriptors supplied by network document providers.
  audioplayers_android:
    path: third_party/audioplayers_android
  ffmpeg_kit_flutter_new_audio:
    path: third_party/ffmpeg_kit_flutter_new_audio

dev_dependencies:
  # Host tests open SQLite through FFI; the Android app uses the sqflite plugin.
  sqflite_common_ffi: ^2.4.5
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  clock: 1.1.3
  analyzer: ^14.6.0
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  riverpod_lint: ^3.1.9
  json_serializable: ^6.15.2
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: 2.1.3
  video_player_platform_interface: 6.9.0

  sqflite_common: ^2.5.14
  shared_preferences_platform_interface: ^2.4.2
flutter_launcher_icons:
  android: true
  image_path: "icon.png"
  image_path_android: "icon_android.png"
  adaptive_icon_background: "#1E4E4F"
  adaptive_icon_foreground: "icon_foreground_android.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "icon_monochrome_android.png"

flutter:
  uses-material-design: true
  generate: true

  shaders:
    - assets/shaders/app_selection_mask.frag

  assets:
    - LICENSE
    - COPYING
    - NOTICE
    - assets/images/
    - assets/brand/logo/png/mornye-lockup-horizontal-white@1x.png
    - assets/fonts/Inter-LICENSE.txt
    - assets/fonts/GoogleSansFlex-LICENSE.txt
    - assets/licenses/usb.txt
    - assets/licenses/oboe.txt
    - assets/licenses/wavpack.txt
    - assets/licenses/flac.txt
    - assets/licenses/ffmpeg.txt
    - assets/licenses/lgpl-3.0.txt
    - assets/licenses/libsmb2.txt
    - assets/licenses/native_palette.txt
    - assets/licenses/native_data_jobs.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
