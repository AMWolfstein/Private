name: sistrum
description: Local offline Android music player
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # State Management
  flutter_riverpod: ^3.4.2

  # Navigation
  go_router: ^18.0.2

# Storage & Persistence
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  path: ^1.9.1
  sqflite: ^2.4.4+1

  # Hashing
  crypto: ^3.0.7

  # In-app updates from GitHub releases
  http: ^1.6.0
  url_launcher: ^6.3.3
  open_filex: ^4.7.0

  # Streaming backup archives
  archive: ^4.5.0

  # UI Components
  liquid_glass_easy: 5.0.0
  cupertino_icons: ^2.0.0
  volume_controller: ^3.7.1

  # Local artwork color extraction
  material_color_utilities: 0.13.0

  # Permissions
  permission_handler: ^13.0.1

  # File Picker
  file_picker: ^13.1.0

  # JSON Serialization
  json_annotation: ^4.12.0

  # Utils
  device_info_plus: ^13.3.0
  share_plus: ^13.3.1
  logger: ^2.7.0

  # FFmpeg for local tag editing, ReplayGain and CUE splitting
  ffmpeg_kit_flutter_new_audio: 2.5.7


  xml: ^7.1.0
  unorm_dart: ^0.3.3

  # Notifications
  flutter_local_notifications: ^22.3.0
  audioplayers: ^6.8.1
  audio_service:
    path: third_party/audio_service
  audio_session: ^0.2.4

dependency_overrides:
  # Preserve Android proxy descriptors supplied by network document providers.
  audioplayers_android:
    path: third_party/audioplayers_android

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  analyzer: ^14.5.0
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_lint: ^3.1.9
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.5

flutter_launcher_icons:
  android: true
  image_path: "icon.png"
  image_path_android: "icon_android.png"
  adaptive_icon_background: "#12100E"
  adaptive_icon_foreground: "icon_foreground_android.png"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: "icon_monochrome_android.png"

flutter:
  uses-material-design: true
  generate: true

  shaders:
    - assets/shaders/sistrum_selection_mask.frag
    - assets/shaders/sistrum_artwork_glass.frag

  assets:
    - assets/images/
    - assets/fonts/Inter-LICENSE.txt
    - assets/licenses/usb.txt
    - assets/licenses/oboe.txt
    - assets/licenses/wavpack.txt
    - assets/licenses/flac.txt
    - assets/licenses/ffmpeg.txt
    - assets/licenses/lgpl-3.0.txt
    - assets/licenses/native_palette.txt
    - assets/licenses/native_data_jobs.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
